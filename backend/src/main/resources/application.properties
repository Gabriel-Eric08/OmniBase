spring.application.name=demo

# Banco de dados (a senha vem da variável de ambiente DB_PASSWORD; não versionar)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/omnibase}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# O schema é mantido pelo init.sql; o Hibernate só confere se as entidades batem com ele
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Upload de documentos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Pasta onde os documentos são guardados (FileStorage local)
storage.local.base-path=./storage
